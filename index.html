<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Forge Studio – Web DAW</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#23282d;--p1:#2f353b;--p2:#383f46;--line:#4a525a;--tx:#d6dde3;--dim:#8b96a0;--ac:#ff9a1f;--ok:#5fd068;--p0:#282d32;--in:#1d2226;--lcd:#14181b;--b1:#4d565e;--b2:#3b4249;--bd:#000;--t1:#3e464e;--t2:#2c3237;--ln2:#2a2f34;--hov:#414a52;--sel:#434c54;--chn:#20252a;--stp2:#5d666f;--rbg:#2b3036}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:12px/1.2 "Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
#app{display:grid;height:100vh;grid-template-columns:200px minmax(0,1fr);grid-template-rows:48px minmax(0,1fr) minmax(0,1fr)}
#top{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 10px;background:linear-gradient(var(--t1),var(--t2));border-bottom:1px solid var(--bd);overflow-x:auto;white-space:nowrap}
.logo{font-weight:800;letter-spacing:2px;color:var(--ac);font-size:15px}.logo span{color:var(--tx);font-weight:300;margin-left:4px}
.b{background:linear-gradient(var(--b1),var(--b2));border:1px solid var(--bd);color:var(--tx);border-radius:3px;padding:5px 9px;cursor:pointer;font:inherit}
.b:hover{filter:brightness(1.2)}.b.on{background:var(--ac);color:#1a1a1a;border-color:#000}
#bRec.on{background:#e53935;color:#fff}
.lcd{background:var(--lcd);color:var(--ac);font-family:Consolas,monospace;border:1px solid var(--bd);border-radius:3px;padding:4px 8px;display:flex;align-items:center;gap:6px}
.lcd input{width:52px;background:transparent;border:0;color:var(--ac);font:inherit;font-size:15px;outline:0}
select,input[type=text],input[type=number]{background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:3px;padding:3px;font:inherit}
.grp{display:flex;gap:4px;align-items:center}
label{color:var(--dim);display:flex;gap:4px;align-items:center}
#browser{grid-row:2/4;overflow:auto;background:var(--p1);border-right:1px solid var(--bd)}
#browser h4{margin:0;padding:6px 8px;background:var(--p0);color:var(--ac);text-transform:uppercase;font-size:11px;letter-spacing:1px;position:sticky;top:0}
#browser .it{padding:5px 12px;cursor:pointer;border-bottom:1px solid var(--ln2);display:flex;justify-content:space-between}
#browser .it:hover{background:var(--hov)}#browser .it i{color:var(--dim);font-style:normal;font-size:10px}
#browser .help{padding:8px;color:var(--dim);line-height:1.5}
#upper{display:flex;flex-direction:column;min-height:0;border-bottom:2px solid var(--bd)}
#tabs{display:flex;background:var(--p0)}
#tabs button{background:var(--p1);color:var(--dim);border:0;border-right:1px solid var(--bd);padding:6px 16px;cursor:pointer;font:inherit}
#tabs button.on{background:var(--p2);color:var(--ac);font-weight:600}
.panel{display:none;flex:1;overflow:auto;position:relative;background:var(--p2);min-height:0}.panel.on{display:block}
#rack{position:relative;min-width:max-content}
.row{display:flex;height:32px;align-items:center;border-bottom:1px solid var(--ln2)}.row.sel{background:var(--sel)}
.ctl{width:340px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px}
.led{width:14px;height:14px;border-radius:50%;background:#3a3f44;border:1px solid var(--bd);cursor:pointer;flex:none}.led.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.chn{width:104px;flex:none;text-align:left;background:var(--chn);border:1px solid var(--bd);border-left:5px solid var(--c);color:var(--tx);border-radius:3px;padding:5px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:inherit}
.sm{width:20px;height:20px;padding:0;background:var(--b2);border:1px solid var(--bd);color:var(--tx);border-radius:3px;cursor:pointer;font-size:10px;flex:none}.sm.on{background:var(--ac);color:#000}
.kn{width:56px;flex:none;accent-color:var(--ac)}.kn+.kn{width:42px}
.trk{width:40px;flex:none}
.steps{display:flex;padding-left:0}
.stp{width:22px;height:24px;margin-right:2px;background:var(--line);border:1px solid #1d2125;border-radius:2px;flex:none;cursor:pointer}
.stp.g{background:var(--stp2)}.stp.on{background:var(--c);box-shadow:inset 0 0 0 1px #fff6}
.mini{display:block;height:28px;cursor:pointer}
#phR,#phP,#phL{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);opacity:.85;pointer-events:none;display:none;z-index:5;box-shadow:0 0 6px var(--tx)}
#mix{display:flex;gap:4px;padding:8px;min-width:max-content}
.strip{width:92px;background:var(--p1);border:1px solid var(--bd);border-radius:4px;padding:6px;display:flex;flex-direction:column;gap:6px;align-items:center}
.strip.m{width:110px;background:var(--p0)}
.strip .nm{width:80px;text-align:center;font-weight:bold;border:1px solid var(--bd);border-radius:3px}.strip .tc{width:80px;height:16px;padding:0;border:1px solid var(--bd);background:none;cursor:pointer}.strip .fm{display:flex;gap:8px;align-items:stretch}
.mt{width:12px;height:130px;background:#111;border:1px solid var(--bd);position:relative;overflow:hidden;border-radius:2px}
.fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,#4caf50 0,#cddc39 70%,#f44336 100%);height:0}
input.v{writing-mode:vertical-lr;direction:rtl;width:22px;height:130px;accent-color:var(--ac)}
.strip label{flex-direction:column;font-size:10px;gap:1px}.strip input[type=range]:not(.v){width:74px;accent-color:var(--ac)}
.num{color:var(--dim);font-size:11px}
#plWrap{position:relative;width:max-content}#plc{display:block;cursor:cell}
#roll{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;background:var(--rbg)}
#rollBar{display:flex;gap:10px;align-items:center;padding:5px 8px;background:var(--p0);border-bottom:1px solid var(--bd);flex-wrap:wrap}
#rName{color:var(--ac)}.hint{color:var(--dim);font-size:11px}
#rollScroll{flex:1;overflow:auto;min-height:0;min-width:0;width:100%}
#rollInner{position:relative;display:flex;width:100%}
#keys{position:sticky;left:0;z-index:4;display:block;cursor:pointer;flex:none}#grid{display:block;cursor:crosshair;position:sticky;left:56px;z-index:1;flex:none}
#plPlay,#plStop{display:none}#app.plmax #plPlay,#app.plmax #plStop{display:inline-block}
#mixBar{position:sticky;left:0;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--p0);border-bottom:1px solid var(--bd)}
#mixTrack{position:relative;flex:1;height:16px;background:var(--in);border:1px solid var(--bd);border-radius:3px;cursor:pointer;overflow:hidden}
#mixFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#8a4f0e,#ff9a1f);opacity:.75}
#mixHead{position:absolute;top:0;bottom:0;width:2px;left:0;background:var(--tx);box-shadow:0 0 6px var(--tx)}
#mixTicks{position:absolute;inset:0;pointer-events:none}
#mixTime{font:12px ui-monospace,Consolas,monospace;color:var(--ac);min-width:64px}#mixLen{color:var(--dim);font-size:11px;min-width:54px;text-align:right}
#plBar{flex-wrap:wrap;position:sticky;left:0;top:0;z-index:6;display:flex;gap:10px;align-items:center;padding:5px 8px;background:var(--p0);border-bottom:1px solid var(--bd)}
#app.rollmax #top,#app.rollmax #browser,#app.rollmax #upper{display:none}
#app.plmax #top,#app.plmax #browser,#app.plmax #roll{display:none}
#app.plmax #upper{grid-column:1/3;grid-row:1/4;border-bottom:0}
#app.rollmax #roll{grid-column:1/3;grid-row:1/4}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#111e;color:#fff;padding:8px 14px;border-radius:6px;border:1px solid var(--ac);opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;max-width:80vw;text-align:center}
#toast.on{opacity:1}

#menu{position:fixed;z-index:100;display:none;background:var(--p0);border:1px solid var(--bd);border-radius:4px;box-shadow:0 6px 18px #0008;min-width:170px;padding:3px 0}
#menu div{padding:7px 14px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
#menu div:hover{background:var(--hov)}#menu div.cur{color:var(--ac);font-weight:600}
#menu .sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--bd);flex:none}
#helpM{position:fixed;inset:0;background:#0009;z-index:101;display:none;align-items:center;justify-content:center}#helpM.on{display:flex}
#helpBox{width:min(780px,94vw);height:min(520px,88vh);background:var(--p1);border:1px solid var(--bd);border-radius:6px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px #000a}
#helpHead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--p0);border-bottom:1px solid var(--bd);color:var(--ac);font-weight:700;letter-spacing:1px;text-transform:uppercase}
#helpBody{display:flex;flex:1;min-height:0}
#helpCats{width:150px;flex:none;background:var(--p0);display:flex;flex-direction:column;border-right:1px solid var(--bd)}
#helpCats button{background:none;border:0;border-bottom:1px solid var(--ln2);color:var(--dim);text-align:left;padding:11px 14px;cursor:pointer;font:inherit;font-size:13px}
#helpCats button:hover{background:var(--hov)}#helpCats button.on{background:var(--p2);color:var(--ac);font-weight:600}
#helpTxt{flex:1;overflow:auto;padding:12px 20px;line-height:1.55;font-size:13px;user-select:text}
#helpTxt h3{margin:4px 0 8px;color:var(--ac);font-size:15px}#helpTxt ul{margin:0;padding-left:18px}#helpTxt li{margin:5px 0}
#helpTxt kbd{background:var(--in);border:1px solid var(--bd);border-radius:3px;padding:0 5px;font:11px ui-monospace,Consolas,monospace}

#fxView{display:none!important;flex:1;min-height:0;flex-direction:column;overflow:hidden}
#roll.fxon #rollScroll{display:none}#roll.fxon #fxView{display:flex}
#fxHead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 8px;background:var(--p1);border-bottom:1px solid var(--bd)}
#fxHead h3{margin:0;color:var(--ac);font-size:13px;letter-spacing:1px;text-transform:uppercase}
#fxBody{flex:1;display:flex;min-height:0}
#fxLib{flex:1;overflow:auto;padding:4px 12px 12px;min-width:0}
#fxLib h5{margin:12px 0 6px;color:var(--ac);font-size:11px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:3px}
.fxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.fxc{position:relative;background:var(--p1);border:1px solid var(--bd);border-left:4px solid var(--fc,var(--ac));border-radius:4px;padding:7px 9px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.fxc:hover{background:var(--hov)}.fxc.on{outline:2px solid var(--ac);background:var(--sel)}
.fxc b{font-size:12px}.fxc span{color:var(--dim);font-size:10.5px;line-height:1.3}
.fxc u{text-decoration:none;font-size:9.5px;color:var(--ac)}
.fxc .x{position:absolute;right:6px;top:4px;color:var(--dim);font-style:normal}.fxc .x:hover{color:#f55}
#fxAdjW{width:320px;flex:none;border-left:1px solid var(--bd);background:var(--p0);display:flex;flex-direction:column;min-height:0}
#fxAdjH{padding:8px 10px;border-bottom:1px solid var(--bd)}#fxAdjH b{color:var(--ac);text-transform:uppercase;font-size:11px;letter-spacing:1px}
#fxSt{display:block;margin-top:3px;color:var(--dim);font-size:11px}
#fxBtns{display:flex;flex-wrap:wrap;gap:5px;padding:7px 10px;border-bottom:1px solid var(--bd)}
#fxAdj{flex:1;overflow:auto;padding:2px 10px 12px}
#fxAdj h6{margin:10px 0 4px;color:var(--dim);font-size:10px;letter-spacing:1px;text-transform:uppercase}
.fxr{display:grid;grid-template-columns:92px 1fr 58px;gap:6px;align-items:center;margin:3px 0}
.fxn{color:var(--tx);cursor:default}.fxr input{width:100%;accent-color:var(--ac)}.fxv{color:var(--ac);font:11px ui-monospace,Consolas,monospace;text-align:right}
#rollRuler{flex:none;height:20px;background:var(--p0);border-bottom:1px solid var(--bd);cursor:pointer;overflow:hidden}#ruler{display:block}
#roll.fxon #rollRuler{display:none}
#tRoll{display:none}#nfx{display:none;background:var(--p0);border-bottom:1px solid var(--bd);padding:6px 10px;max-height:42%;overflow:auto;flex:none}#roll.nfxon #nfx{display:block}
#nfxH{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}#nfxH>b{color:#ff4fa3;text-transform:uppercase;letter-spacing:1px;font-size:12px}#nfxSt{color:var(--dim);font-size:11px;margin-right:6px;flex:1 1 260px}#nfxPre{display:contents}
#nfxG{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 16px}#nfx.none #nfxG{opacity:.4;pointer-events:none}.ng h6{margin:4px 0 2px;color:var(--dim);font-size:10px;letter-spacing:1px;text-transform:uppercase}
.nr{display:grid;grid-template-columns:90px 1fr 60px;gap:6px;align-items:center;margin:2px 0}.nr input{width:100%;accent-color:#ff4fa3}.nv{font:11px ui-monospace,Consolas,monospace;color:var(--ac);font-style:normal;text-align:right}
</style></head><body>
<div id="app">
<header id="top">
 <div class="logo">FORGE<span>STUDIO</span></div>
 <div class="grp"><button class="b" id="bPlay" title="Space">▶ Play</button><button class="b" id="bStop">■</button><button class="b" id="bRec" title="Record keyboard notes while playing (pattern mode)">●</button><button class="b" id="bMode" title="Pattern / Song mode">PAT</button><button class="b" id="bMet">Metro</button></div>
 <div class="lcd"><label style="color:#a66">BPM</label><input id="bpm" type="number" min="40" max="240" value="100"></div>
 <div class="lcd" id="pos">001:1:1</div>
 <div class="grp"><label>Pattern</label><select id="patSel"></select><button class="b" id="patNew" title="New pattern">+</button><button class="b" id="patDup" title="Duplicate pattern">⧉</button><label>Bars</label><select id="patBars"><option>1</option><option>2</option><option>4</option><option>8</option></select></div>
 <div class="grp"><label>Sound bank</label><select id="bank"><option>FluidR3_GM</option><option>MusyngKite</option><option>FatBoy</option></select></div>
 <div class="grp"><label>Master</label><input type="range" id="mVol" min="0" max="1.2" step=".01" value=".85" style="width:80px;accent-color:var(--ac)"></div>
 <div class="grp"><button class="b" id="mFile">File ▾</button><button class="b" id="mTheme">Theme ▾</button><button class="b" id="mHelp">Help</button><input type="file" id="fLoad" accept=".json" hidden></div>
</header>
<aside id="browser"></aside>
<section id="upper">
 <div id="tabs"><button data-p="rackP" class="on">Channel Rack</button><button data-p="plP">Playlist</button><button data-p="mixP">Mixer</button></div>
 <div class="panel on" id="rackP"><div id="rack"></div></div>
 <div class="panel" id="plP"><div id="plBar"><button class="b" id="plPlay" title="Play / pause (Space)">▶ Play</button><button class="b" id="plStop" title="Stop">■</button><button class="b" id="plMode" title="Pattern / Song mode – SONG plays the playlist">PAT</button><button class="b" id="plMax" title="Maximize / restore the playlist (Esc to restore)">⤢ Maximize</button><button class="b on" id="bLoop" title="Loop playback on/off (applies to pattern and song mode)">⟲ Loop: On</button><label>Zoom ↔ <input type="range" id="plZX" min="1" max="4" step=".25" value="1" style="width:70px;accent-color:var(--ac)"></label><label>↕ <input type="range" id="plZY" min="1" max="4" step=".25" value="1" style="width:70px;accent-color:var(--ac)"></label></div><div id="plWrap"><canvas id="plc"></canvas><div id="phL"></div></div></div>
 <div class="panel" id="mixP"><div id="mixBar"><span id="mixTime">001:1:1</span><div id="mixTrack" title="Playback position – click or drag to jump"><div id="mixFill"></div><div id="mixTicks"></div><div id="mixHead"></div></div><span id="mixLen"></span></div><div id="mix"></div></div>
</section>
<section id="roll">
 <div id="rollBar">
  <button class="b" id="rMax" title="Maximize / restore piano roll (Esc to restore)">⤢ Maximize</button><button class="b" id="rPlay" title="Play / pause (Space)">▶</button>
  <b id="rName"></b><select id="rInst"></select>
  <span class="grp" id="rTabs"><button class="b on" id="tRoll">Piano Roll</button><button class="b" id="tFx" title="Effects library &amp; adjustments">Note FX</button></span>
  <span id="rollTools" style="display:contents">
  <label>Snap <select id="rSnap"><option value=".5">1/32</option><option value="1" selected>1/16</option><option value="2">1/8</option><option value="4">1/4</option><option value="16">Bar</option></select></label>
  <label>Velocity <input type="range" id="rVel" min=".1" max="1" step=".01" value=".8" style="width:70px;accent-color:var(--ac)"></label>
  <label>Keys oct <button class="b" id="oDn">−</button><span id="oV">C4</span><button class="b" id="oUp">+</button></label>
  <button class="b" id="rClr">Clear notes</button><button class="b" id="rAddPl" title="Place this pattern on this channel's playlist track (first free spot)">+ Add to playlist</button></span>
  
 </div>
 <div id="nfx"><div id="nfxH"><b>Note FX</b><span id="nfxSt"></span><span id="nfxPre"></span><button class="b" id="nfxHear">▶ Hear note</button><button class="b" id="nfxClr">Clear FX</button></div><div id="nfxG"></div></div>
 <div id="rollRuler" title="Click or drag to choose where playback starts (jumps live while playing)"><canvas id="ruler" height="20"></canvas></div>
 <div id="rollScroll"><div id="rollInner"><canvas id="keys" width="56"></canvas><canvas id="grid"></canvas><div id="phP"></div></div></div>
 <div id="fxView">
  <div id="fxHead"><h3>FX Library</h3>
   <label>Apply presets to <select id="fxScope"><option value="all">All channels</option><option value="sel">Selected channel only</option></select></label>
   <button class="b" id="fxRaw" title="Bypass the mixer reverb sends so the mix is fully raw">Raw mix</button>
   <button class="b" id="fxAud" title="Play a short test phrase on the selected channel">▶ Audition</button>
   <button class="b" id="fxBack">← Piano Roll</button>
   <span class="hint">Click a preset to load it. Press computer-keyboard keys (Z–M) to hear it while you tweak.</span></div>
  <div id="fxBody"><div id="fxLib"></div>
   <div id="fxAdjW"><div id="fxAdjH"><b>Effect adjustments</b><span id="fxSt"></span></div>
    <div id="fxBtns"><button class="b" id="fxByp">Bypass</button><button class="b" id="fxRst" title="Reset this channel to Acoustic (no effects)">Reset</button><button class="b" id="fxCopy" title="Copy this channel's settings to every channel">Copy to all</button><button class="b" id="fxSave" title="Save these settings as your own preset">Save preset</button></div>
    <div id="fxAdj"></div></div></div>
 </div>
</section>
</div>
<div id="toast"></div>
<div id="helpM"><div id="helpBox"><div id="helpHead"><span>Help</span><button class="b" id="helpX">✕</button></div><div id="helpBody"><div id="helpCats"></div><div id="helpTxt"></div></div></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NN=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const NIDX={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const mname=m=>NN[m%12]+(Math.floor(m/12)-1);
const isBlack=m=>[1,3,6,8,10].includes(m%12);
/* ---------- catalog ---------- */
const CAT={
'Strings':[['Violin','sf','violin'],['Viola','sf','viola'],['Cello','sf','cello'],['Contrabass','sf','contrabass'],['String Ensemble 1','sf','string_ensemble_1'],['String Ensemble 2','sf','string_ensemble_2'],['Pizzicato Strings','sf','pizzicato_strings'],['Tremolo Strings','sf','tremolo_strings'],['Orchestral Harp','sf','orchestral_harp'],['Synth Strings','sf','synth_strings_1']],
'Bass':[['Finger Bass','sf','electric_bass_finger'],['Pick Bass','sf','electric_bass_pick'],['Acoustic Bass','sf','acoustic_bass'],['Slap Bass','sf','slap_bass_1'],['Synth Bass 1','sf','synth_bass_1'],['Synth Bass 2','sf','synth_bass_2'],['Sub Bass (built-in)','syn','sub']],

 if(e.key==='Delete'||e.key==='Backspace'){if(selList().length){e.preventDefault();deleteSel()}return}
 if(e.key==='Escape'){clearSel();drawRoll();return}
 if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();
 if(k==='c'){if(copySel())toast('Copied '+clip.notes.length+' note'+(clip.notes.length>1?'s':''));e.preventDefault();return}
 if(k==='x'){if(copySel())deleteSel();e.preventDefault();return}
 if(k==='v'){e.preventDefault();pasteHere();return}
 if(k==='d'){e.preventDefault();if(copySel())pasteClip(pasteNext);return}
 if(k==='a'){e.preventDefault();const ch=S.channels[S.sel];if(ch){setSel(nts(cp(),ch));drawRoll()}return}
 if(k==='z'&&!e.shiftKey){e.preventDefault();undo()}
 else if(k==='r'||k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo()}
});

  b1:L?W:cmix(p2,W,.1),b2:L?cmix(p2,K,.08):cmix(p2,W,.02),bd:L?cmix(p2,K,.5):K,
  t1:L?cmix(p2,W,.6):cmix(p2,W,.07),t2:cmix(p1,K,L?.04:.08),

  chn:L?W:cmix(p1,K,.3),stp2:cmix(line,tx,.18),rbg:cmix(p1,K,L?.04:.08),
  rowB:cmix(p1,K,L?.1:.12),rowW:cmix(p2,K,L?0:.05),oct:cmix(p2,tx,.35),rowLn:cmix(p1,K,L?.12:.25),
  gBar:cmix(p2,tx,.6),gBeat:cmix(p2,tx,.2),gStep:cmix(p2,K,L?.08:.15),
  alt:cmix(p2,K,.1),pl1:cmix(p2,tx,.12),mini:cmix(p2,line,.3)};

const HELP={
'General':`<h3>General</h3><ul>
<li><kbd>Space</kbd> plays / pauses. The ■ button stops and returns to the start.</li>
<li><b>PAT / SONG</b> switches between playing the current pattern and playing the whole Playlist.</li>
<li><b>●</b> Record: press it, press play, then type notes on your keyboard to record them into the selected channel (pattern mode).</li>
<li><b>Metro</b> turns the metronome on or off. <b>BPM</b> sets the tempo.</li>
<li><b>Pattern</b> picker selects a pattern; <b>+</b> makes a new one, <b>⧉</b> duplicates the current one; <b>Bars</b> sets its length.</li>
<li><b>Sound bank</b> chooses which sample set the sampled instruments use.</li>
<li><kbd>Ctrl</kbd>+<kbd>Z</kbd> undo, <kbd>Ctrl</kbd>+<kbd>Y</kbd> (or <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd>) redo.</li>
<li><b>File</b> menu: save / load a project and export audio. <b>Theme</b> menu: change the look of the studio.</li></ul>`,
'Piano Roll':`<h3>Piano Roll</h3><ul>
<li><b>Click</b> an empty spot to add a note. <b>Drag</b> a note to move it, drag its left or right edge to change its length.</li>
<li><b>Right-click</b> a note to delete it. <kbd>Del</kbd> deletes the selected notes.</li>
<li>Hold <kbd>Shift</kbd> or <kbd>Ctrl</kbd> and drag a box to select several notes. <kbd>Ctrl</kbd>+<kbd>A</kbd> selects all.</li>
<li><kbd>Ctrl</kbd>+<kbd>C</kbd> copy, <kbd>Ctrl</kbd>+<kbd>X</kbd> cut, <kbd>Ctrl</kbd>+<kbd>V</kbd> paste (at the mouse), <kbd>Ctrl</kbd>+<kbd>D</kbd> duplicate.</li>
<li>Play notes from the keyboard with <kbd>Z</kbd>–<kbd>M</kbd> and <kbd>Q</kbd>–<kbd>I</kbd>; the <b>Keys oct</b> buttons change the octave. Click the piano keys to hear a note.</li>
<li><b>Snap</b> sets the grid the notes snap to. <b>Velocity</b> sets the loudness of new notes.</li>
<li>The pattern grows automatically when notes go past its end, and you can scroll right as far as you like.</li>
<li>The dropdown next to the channel name swaps that channel's instrument. <b>Clear notes</b> empties the channel in this pattern.</li>
<li><b>+ Add to playlist</b> puts the current pattern on this channel's Playlist track in the first free spot.</li>
<li><b>Pattern end:</b> drag the orange END tab (or the orange line) left or right to shorten or lengthen the pattern, one bar at a time.</li>
<li><b>Start position:</b> click or drag along the bar ruler above the grid to choose where playback begins; press Play to start from the green marker. Dragging while playing jumps there live.</li>

'Playlist':`<h3>Playlist</h3><ul>
<li>Every track is a channel from the Channel Rack. A block on a track plays only that channel's notes from the pattern.</li>
<li><b>Left-click</b> places the selected pattern. <b>Right-click</b> removes a block.</li>
<li>Blocks use their channel's color. Click the ring at the left of a track to change the color, <b>double-click</b> the name to rename it.</li>

$('#helpCats').innerHTML=Object.keys(HELP).map(c=>'<button data-c="'+c+'">'+c+'</button>').join('');

/* ---------- FX tab UI ---------- */
const FXCATS=[['Natural','#81c784'],['Cinematic','#ff9a1f'],['Spacey','#b388ff'],['Tone & Color','#4fc3f7'],['Grit & Motion','#ef5350'],['My Presets','#ffd54f']];
const allPre=()=>FXPRE.concat(S.userFx||[]);
let fxScope='all';
function fxOn(){return $('#roll').classList.contains('fxon')}
function ensureFx(ch){if(!ch.fx)ch.fx={preset:'Acoustic',p:Object.assign({},FXDEF),off:false,mod:false};return ch.fx}
function fxChips(p){const q=Object.assign({},FXDEF,p),o=[];
 if(q.rev>.01)o.push('Reverb');if(q.eMix>.01)o.push('Echo');if(q.cho>.01)o.push('Chorus');if(q.trem>.01)o.push('Tremolo');if(q.drv>.01)o.push('Drive');
 if(q.lp<19000||q.hp>25)o.push('Filter');if(Math.abs(q.lo)>.1||Math.abs(q.hi)>.1)o.push('EQ');
 return o.length?o.join(' · '):'No effects'}
function fxStatus(ch){const f=ch.fx;$('#fxSt').textContent=ch.name+' · '+(f?f.preset+(f.mod?' (modified)':''):'Acoustic')+(f&&f.off?' · bypassed':'');
 $('#fxByp').classList.toggle('on',!!(f&&f.off));$('#fxByp').textContent=f&&f.off?'Bypassed':'Bypass'}
function renderFx(){
 const ch=S.channels[S.sel],cur=ch&&ch.fx?ch.fx.preset:'Acoustic',pre=allPre();let h='';
 for(const[cat,col]of FXCATS){
  const items=pre.map((p,i)=>[p,i]).filter(a=>a[0].c===cat);if(!items.length)continue;
  h+=`<h5>${cat}</h5><div class="fxg">`+items.map(([p,i])=>`<div class="fxc ${p.n===cur?'on':''}" data-i="${i}" style="--fc:${col}"><b>${esc(p.n)}</b><span>${esc(p.d||'')}</span><u>${fxChips(p.p)}</u>${cat==='My Presets'?`<i class="x" data-del="${i}" title="Delete preset">✕</i>`:''}</div>`).join('')+'</div>';
 }
 $('#fxLib').innerHTML=h;$('#fxRaw').classList.toggle('on',!!S.dryMix);$('#fxScope').value=fxScope;
 if(!ch){$('#fxSt').textContent='No channel selected';$('#fxAdj').innerHTML='';return}
 const P=Object.assign({},FXDEF,ch.fx&&ch.fx.p);fxStatus(ch);let a='';
 for(const g of['Space','Echo','Modulation','Tone','Grit','Output']){a+=`<h6>${g}</h6>`;
  FXP.filter(d=>d.g===g).forEach(d=>{a+=`<div class="fxr"><div class="fxn" data-r="${d.k}" title="Double-click to reset">${d.n}</div><input type="range" data-k="${d.k}" min="0" max="1000" step="1" value="${toSl(d,P[d.k])}"><span class="fxv">${d.f(P[d.k])}</span></div>`})}
 $('#fxAdj').innerHTML=a;
}
function showFx(on){
 $('#roll').classList.toggle('fxon',on);$('#tFx').classList.toggle('on',on);$('#tRoll').classList.toggle('on',!on);
 $('#rollTools').style.display=on?'none':'contents';
 if(on)renderFx();else requestAnimationFrame(()=>{sizeRoll();drawKeys();drawRoll()});
}
function setDry(v){S.dryMix=v;S.tracks.forEach((_,i)=>applyTrack(i));$('#fxRaw').classList.toggle('on',v)}
function auditionFx(){
 const ch=S.channels[S.sel];if(!ch)return;initAudio();ctx.resume();
 if(ch.type==='sf'){const r=sfBufs[S.bank+'/'+ch.inst];if(r&&r.state==='load'){toast('"'+ch.name+'" samples are still loading…');return}}
 const b=ch.cat==='Bass'?36:60,t=ctx.currentTime+.03;
 if(ch.type==='drum')[0,.3,.6].forEach(o=>playNote(ch,60,t+o,.2,S.vel));
 else[[0,0],[.28,4],[.56,7],[.84,12]].forEach(([o,s])=>playNote(ch,b+s,t+o,.7,S.vel));
}
function applyPreset(i){
 const pr=allPre()[i];if(!pr||!S.channels.length)return;
 const all=fxScope==='all',T=all?S.channels:[S.channels[S.sel]];pushUndo();
 T.forEach(ch=>{ch.fx={preset:pr.n,p:Object.assign({},FXDEF,pr.p),off:false,mod:false}});
 if(all)setDry(!!pr.raw);
 renderFx();
 toast(pr.n+' applied to '+(all?'all channels':S.channels[S.sel].name)+(all&&pr.raw?' (mixer reverb sends bypassed)':'')+'.');
 if(!playing)auditionFx();
}
$('#fxLib').addEventListener('click',e=>{
 const del=e.target.closest('[data-del]');
 if(del){const i=+del.dataset.del-FXPRE.length;if(i>=0){S.userFx.splice(i,1);renderFx()}return}
 const c=e.target.closest('.fxc');if(c)applyPreset(+c.dataset.i);
});
$('#fxAdj').addEventListener('pointerdown',e=>{if(e.target.dataset.k)pushUndo()});
$('#fxAdj').addEventListener('input',e=>{
 const k=e.target.dataset.k;if(!k)return;const ch=S.channels[S.sel];if(!ch)return;
 const d=FXD[k],f=ensureFx(ch),v=fromSl(d,+e.target.value);f.p[k]=v;f.mod=true;f.off=false;
 e.target.parentNode.querySelector('.fxv').textContent=d.f(v);fxStatus(ch);
});
$('#fxAdj').addEventListener('dblclick',e=>{
 const k=e.target.dataset.r;if(!k)return;const ch=S.channels[S.sel];if(!ch)return;
 pushUndo();const f=ensureFx(ch);f.p[k]=FXD[k].def;f.mod=true;renderFx();
});
$('#fxByp').onclick=()=>{const ch=S.channels[S.sel];if(!ch)return;pushUndo();const f=ensureFx(ch);f.off=!f.off;renderFx()};
$('#fxRst').onclick=()=>{const ch=S.channels[S.sel];if(!ch)return;pushUndo();ch.fx={preset:'Acoustic',p:Object.assign({},FXDEF),off:false,mod:false};renderFx();toast(ch.name+' reset to Acoustic.')};
$('#fxCopy').onclick=()=>{const ch=S.channels[S.sel];if(!ch)return;pushUndo();const src=JSON.stringify(ensureFx(ch));S.channels.forEach(o=>{o.fx=JSON.parse(src)});renderFx();toast('Copied '+ch.name+"'s effects to all channels.")};
$('#fxSave').onclick=()=>{
 const ch=S.channels[S.sel];if(!ch)return;let nm=(prompt('Name for your preset:',ch.name+' FX')||'').trim().slice(0,28);if(!nm)return;
 if(FXPRE.some(p=>p.n===nm))nm+=' (mine)';
 const f=ensureFx(ch);S.userFx=(S.userFx||[]).filter(p=>p.n!==nm);S.userFx.push({n:nm,c:'My Presets',d:'Saved from '+ch.name+'.',p:Object.assign({},f.p)});
 f.preset=nm;f.mod=false;renderFx();toast('Saved preset "'+nm+'" under My Presets.');
};
$('#fxAud').onclick=auditionFx;
$('#fxRaw').onclick=()=>{setDry(!S.dryMix);toast(S.dryMix?'Raw mix on – mixer reverb sends bypassed.':'Raw mix off – mixer reverb sends restored.')};
$('#fxScope').onchange=e=>{fxScope=e.target.value};
$('#tFx').onclick=()=>showFx(true);$('#tRoll').onclick=()=>showFx(false);$('#fxBack').onclick=()=>showFx(false);
/* ---------- piano-roll ruler: choose where playback starts + end-of-pattern helper ---------- */
const ruler=$('#ruler'),rcx=ruler.getContext('2d');let rulerDrag=false;
function onEndHandle(x,y,n){
 const endX=cp().bars*16*SW,sy=$('#rollScroll').scrollTop;
 return(!n&&Math.abs(x-endX)<=6)||(y>=sy&&y<=sy+14&&x>=endX-34&&x<=endX+8);
}
function seekStep(st){
 const L=loopLen();st=Math.max(0,Math.min(L-1,Math.floor(st)));startStep=st;
 if(playing&&ctx){clearTimeout(endTO);curStep=st;nextTime=ctx.currentTime+.05;visQ=[];panic();clearInterval(timer);timer=setInterval(sched,25);sched()}
}
function rulerSeek(e,first){
 const rs=$('#rollScroll'),r=ruler.getBoundingClientRect(),p=cp();
 let loc=Math.max(0,(e.clientX-r.left-56+rs.scrollLeft)/SW);loc=Math.min(p.bars*16-1,Math.floor(loc));
 if(S.mode==='pat'){seekStep(loc);return}
 const c=S.playlist.find(c=>c.pat===S.cur);
 if(!c){if(first)toast("This pattern isn't placed in the Playlist – switch to PAT mode or add it first.");return}
 seekStep(c.bar*16+loc);
}
function localStart(){
 if(S.mode==='pat')return startStep;
 const p=cp();for(const c of S.playlist){if(c.pat!==S.cur)continue;const l=startStep-c.bar*16;if(l>=0&&l<p.bars*16)return l}return null;
}
function drawRuler(){
 const rs=$('#rollScroll'),cw=ruler.parentNode.clientWidth;if(!cw)return;
 if(ruler.width!==cw)ruler.width=cw;
 const H=20,ox=rs.scrollLeft,p=cp(),W=p.bars*16;
 rcx.setTransform(1,0,0,1,0,0);rcx.clearRect(0,0,cw,H);rcx.fillStyle=TC.p0;rcx.fillRect(0,0,cw,H);
 rcx.fillStyle=TC.dim;rcx.font='9px sans-serif';rcx.fillText('START',10,13);
 rcx.save();rcx.beginPath();rcx.rect(56,0,cw-56,H);rcx.clip();rcx.translate(56-ox,0);
 rcx.fillStyle='rgba(0,0,0,.3)';rcx.fillRect(W*SW,0,1e6,H);
 rcx.font='10px sans-serif';
 for(let s=Math.floor(ox/SW);s<=Math.ceil((ox+cw)/SW);s++){
  if(s%16===0){rcx.fillStyle=TC.gBar;rcx.fillRect(s*SW,0,1,H);rcx.fillStyle=TC.ac;rcx.fillText(s/16+1,s*SW+4,12)}
  else if(s%4===0){rcx.fillStyle=TC.gBeat;rcx.fillRect(s*SW,H-6,1,6)}
 }
 rcx.fillStyle=TC.ac;rcx.fillRect(W*SW-1,0,2,H);
 const l=localStart();
 if(l!=null&&l<W){const x=l*SW;rcx.fillStyle='#5fd068';rcx.fillRect(x,0,2,H);rcx.beginPath();rcx.moveTo(x,0);rcx.lineTo(x+11,0);rcx.lineTo(x,10);rcx.closePath();rcx.fill()}
 const lp=localPh();
 if(lp!=null){rcx.fillStyle=TC.tx;rcx.fillRect(lp*SW,0,2,H)}
 rcx.restore();
}
ruler.addEventListener('mousedown',e=>{if(e.button!==0)return;initAudio();rulerDrag=true;rulerSeek(e,true)});
window.addEventListener('mousemove',e=>{if(rulerDrag)rulerSeek(e,false)});
window.addEventListener('mouseup',()=>{rulerDrag=false});
/* boot */
computeTheme(themeName);initAudio();defaultProject();renderAll();frame();

/* ================= NOTE FX (instrument-based, per note) ================= */
function artBend(p,b,t,dur){if(!NB||NB.m==='off')return;const a=Math.pow(2,NB.a/12),m=NB.m;dur=Math.max(.06,dur);const T=Math.min(NB.T,dur*.9);
 if(m==='rise'||m==='scoop'){p.setValueAtTime(m==='rise'?b/a:b*a,t);p.exponentialRampToValueAtTime(b,t+T)}
 else{p.setValueAtTime(b,t+dur-T);p.exponentialRampToValueAtTime(m==='dive'?b/a:b*a,t+dur)}}
function nfxVib(p,t,dur){if(!NB||!(NB.vd>0))return;
 if(!NB.vg){const o=ctx.createOscillator(),g=ctx.createGain(),d=Math.min(1.2,dur*NB.vdl);o.frequency.value=NB.vr;g.gain.setValueAtTime(0,t);g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(NB.vd,t+d+.3);o.connect(g);o.start(t);o.stop(t+dur+.3);NB.vg=g}
 NB.vg.connect(p)}
const nfxActive=f=>f.fi>0||f.fo>0||f.vd>0||f.td>0||f.bend!=='off'||f.la!==1;
function nfxChain(f,t,dur,out){const I=ctx.createGain(),F=ctx.createGain(),Q=ctx.createGain(),L=bq('lowpass',nfxCut(f.la),.7);
 I.connect(F);F.connect(Q);Q.connect(L);L.connect(out);const e=t+Math.max(.05,dur);
 F.gain.setValueAtTime(f.fi>0?.0001:1,t);if(f.fi>0)F.gain.linearRampToValueAtTime(1,t+dur*f.fi);
 if(f.fo>0){F.gain.setValueAtTime(1,t+dur*Math.max(1-f.fo,f.fi));F.gain.linearRampToValueAtTime(.0001,e)}
 if(f.td>0){const o=ctx.createOscillator(),g=ctx.createGain();Q.gain.value=1-f.td/2;g.gain.value=f.td/2;o.frequency.value=f.tr;o.connect(g);g.connect(Q.gain);o.start(t);o.stop(e+3)}
 return I}
function playNote(ch,m,t,dur,vel,fx){const n=chNode(ch);let D=n.g;
 if(fx&&nfxActive(fx)){D=nfxChain(fx,t,dur,n.g);if(ch.type!=='drum')NB={m:fx.bend,a:fx.ba,T:fx.bt,vd:fx.vd,vr:fx.vr,vdl:fx.vdl}}
 try{return playNote0(ch,m,t,dur,vel,D)}finally{NB=null}}
/* instrument profiles: presets adapt to the sound being played */
function nfxProf(ch){const c=ch.cat,i=ch.inst||'';
 if(ch.type==='drum')return{k:'Drums',vr:5,vd:0,tr:6,tip:'drums only use fades, tremolo and tone.'};
 if(ch.cat==='Organs')return{k:'Organ',vr:6.5,vd:12,tr:6.5,tip:'organs hold constant volume – a Leslie-style tremolo or light vibrato and fades sound most natural.'};
 if(/kalimba|koto|sitar|banjo|shamisen|steel_drums|tubular|pizz|harp|guitar|piano|harpsichord|clavinet|celesta|music_box|vibraphone|marimba|xylophone|glock|bells|pluck/.test(i)||c==='Pianos')return{k:'Struck/plucked',vr:5,vd:10,tr:5.5,tip:'these can\'t hold vibrato in real life, so it stays subtle – fades, tremolo and falls sound most natural.'};
 if(c==='Strings')return{k:'Strings',vr:5.8,vd:28,tr:8,tip:'bowed strings suit vibrato that starts after the note begins.'};
 if(/choir|voice|pad_4/.test(i))return{k:'Voice',vr:5.2,vd:24,tr:4,tip:'voices breathe in with a late, gentle vibrato.'};
 if(c==='Keys & Winds'||c==='Winds & Brass')return{k:'Winds/Brass',vr:5.2,vd:26,tr:5.5,tip:'wind and brass players swell and add vibrato on long notes.'};
 if(c==='Pads')return{k:'Pads',vr:4,vd:14,tr:3,tip:'pads like slow, soft movement.'};
 if(c==='Bass')return{k:'Bass',vr:4.5,vd:12,tr:5,tip:'keep bass movement slow and shallow.'};
 return{k:'Lead',vr:5.5,vd:22,tr:6,tip:'leads sound human with late vibrato and slides.'}}
const NS=[['Fade','fi','Fade in','Volume grows from silence over the note',0,1,.01,fmtP],['Fade','fo','Fade out','Volume dies away before the note ends',0,1,.01,fmtP],
 ['Vibrato','vd','Vibrato depth','How far the pitch wavers (cents)',0,100,1,v=>Math.round(v)+' ct'],['Vibrato','vr','Vibrato speed','',2,9,.1,fmtR],['Vibrato','vdl','Starts after','Real players start vibrato late',0,1,.01,fmtP],
 ['Tremolo','td','Tremolo depth','Volume wavering',0,1,.01,fmtP],['Tremolo','tr','Tremolo speed','',.5,12,.1,fmtR],
 ['Pitch slide','ba','Slide size','Semitones',.1,4,.1,v=>v.toFixed(1)+' st'],['Pitch slide','bt','Slide time','',.03,1,.01,v=>Math.round(v*1000)+' ms'],
 ['Tone','la','Warmth','Softer ← natural',0,1,.01,v=>v>=.99?'Natural':Math.round(nfxCut(v))+' Hz']];
const NPRE=[['Fade In',P=>({fi:.8})],['Fade Out',P=>({fo:.8})],['Swell (crescendo)',P=>({fi:.7,fo:.25})],['Fade In + Out',P=>({fi:.5,fo:.5})],
 ['Vibrato',P=>({vd:P.vd,vr:P.vr,vdl:.35})],['Singing Vibrato',P=>({vd:P.vd*1.3,vr:P.vr-1.2,vdl:.5,fi:.2})],['Tremolo',P=>({td:.45,tr:P.tr})],['Soft Tremolo',P=>({td:.2,tr:P.tr-2})],
 ['Slide Up Into Note',P=>({bend:'rise',ba:1,bt:.12})],['Fall Off',P=>({bend:'dive',ba:2,bt:.25})],['Sigh',P=>({fo:.6,bend:'dive',ba:1,bt:.4,la:.8})],['Warm',P=>({la:.55})]];
const nOpt=(a,c)=>a.map(([v,l])=>`<option value="${v}" ${String(v)===String(c)?'selected':''}>${l}</option>`).join('');
const nTargets=()=>{const ch=S.channels[S.sel];if(!ch)return[];const s=selList();if(s.length)return s;return NFXN&&nts(cp(),ch).includes(NFXN)?[NFXN]:[]};
function nfxBuild(){let h='',g='';
 for(const d of NS){if(d[0]!==g){g=d[0];h+=`<div class="ng"><h6>${g}</h6>`;
   if(g==='Pitch slide')h+=`<div class="nr"><span>Style</span><select data-s="bend">${nOpt([['off','Off'],['rise','Slide up into note'],['scoop','Slide down into note'],['dive','Fall off at end'],['lift','Lift at end']])}</select><i></i></div>`}
  h+=`<div class="nr" title="${d[3]}"><span>${d[2]}</span><input type="range" data-k="${d[1]}" min="${d[4]}" max="${d[5]}" step="${d[6]}"><i class="nv"></i></div>`;
  const nx=NS[NS.indexOf(d)+1];if(!nx||nx[0]!==g)h+='</div>'}
 $('#nfxG').innerHTML=h;$('#nfxPre').innerHTML=NPRE.map((p,i)=>`<button class="b" data-p="${i}">${p[0]}</button>`).join('')}
let nfxLast=null,nfxCnt=-1,nfxCh=-1;
function nfxSync(force){const T=nTargets(),ch=S.channels[S.sel],f=T[0]&&T[0].fx||NFD;if(!force&&T[0]===nfxLast&&T.length===nfxCnt&&(ch&&ch.id)===nfxCh)return;nfxLast=T[0];nfxCnt=T.length;nfxCh=ch&&ch.id;
 const P=ch?nfxProf(ch):null;
 $('#nfxSt').textContent=(ch?ch.name+' ('+P.k+') – '+P.tip+'  ':'')+(T.length?'· '+T.length+' note'+(T.length>1?'s':'')+' selected':'· Click a note to edit its effects');$('#nfx').classList.toggle('none',!T.length);
 document.querySelectorAll('#nfxG input').forEach(i=>{const d=NS.find(x=>x[1]===i.dataset.k);i.value=f[d[1]];i.parentNode.querySelector('.nv').textContent=d[7](+f[d[1]])});
 document.querySelectorAll('#nfxG select').forEach(s=>s.value=f[s.dataset.s])}
function nfxSet(fn){nTargets().forEach(n=>{n.fx=Object.assign({},NFD,n.fx);fn(n.fx)});drawRoll()}
function nfxHear(){const ch=S.channels[S.sel],n=nTargets()[0];if(!ch||!n)return;initAudio();ctx.resume();playNote(ch,n.n,ctx.currentTime+.03,Math.max(.8,n.d*stepDur()),n.v,n.fx)}
$('#nfxG').addEventListener('pointerdown',e=>{if(e.target.dataset.k)pushUndo()});
$('#nfxG').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;const d=NS.find(x=>x[1]===k),v=+e.target.value;nfxSet(f=>f[k]=v);e.target.parentNode.querySelector('.nv').textContent=d[7](v)});
$('#nfxG').addEventListener('change',e=>{if(!(e.target.dataset.k||e.target.dataset.s))return;
 if(e.target.dataset.s){pushUndo();const k=e.target.dataset.s,v=e.target.value;nfxSet(f=>f[k]=v)}nfxHear()});
$('#nfxPre').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b||!nTargets().length){toast('Click a note first, then pick an effect.');return}
 pushUndo();const P=nfxProf(S.channels[S.sel]),p=NPRE[+b.dataset.p][1](P);nfxSet(f=>{Object.assign(f,NFD,p)});nfxSync(true);nfxHear()});
$('#nfxClr').onclick=()=>{const T=nTargets();if(!T.length)return;pushUndo();T.forEach(n=>delete n.fx);drawRoll();nfxSync(true)};
$('#nfxHear').onclick=nfxHear;
$('#tFx').onclick=()=>{const on=!$('#roll').classList.contains('nfxon');$('#roll').classList.toggle('nfxon',on);$('#tFx').classList.toggle('on',on);nfxSync(true);requestAnimationFrame(()=>{sizeRoll();drawKeys();drawRoll()})};
nfxBuild();nfxSync(true);setInterval(()=>nfxSync(),250);
</script></body></html>
